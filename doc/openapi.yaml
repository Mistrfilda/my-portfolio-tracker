                - createdAt
            properties:
                id:
                    type: string
                    format: uuid
                value:
                    oneOf:
                        - type: number
                          format: float
                        - type: boolean
                        - type: string
                    nullable: true
                unit:
                    type: string
                    nullable: true
                createdAt:
                    type: string
