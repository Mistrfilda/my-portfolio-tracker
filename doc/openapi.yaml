openapi: 3.0.0

info:
    title: My Portfolio Tracker API
    version: 1.0.0

tags:
    - name: System
      description: System and health-check endpoints.
    - name: Dashboard
      description: Dashboard summary endpoints.
    - name: Stocks
      description: Stock asset endpoints.
    - name: Home Devices
      description: Home device measurement endpoints.

security:
    - OAuth2: [api:read]

paths:
    /ping:
        get:
            summary: Ping the API
            tags:
                - System
            security:
                - OAuth2: [api:read]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
    /dashboard/values:
        get:
            summary: Get dashboard value groups
            description: >-
                Temporarily returns the original portfolio owner's data (filip)
                for both user and client tokens. Per-account API isolation is a separate migration.
            tags:
                - Dashboard
            security:
                - OAuth2: [api:read]
            responses:
                '200':
                    description: List of dashboard value groups
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/DashboardValueGroup'
    /stocks:
        get:
            summary: Get list of all stock assets
            tags:
                - Stocks
            security:
                - OAuth2: [api:read]
            responses:
                '200':
                    description: List of stock assets
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/StockAsset'
    /stocks/{id}:
        get:
            summary: Get single stock asset detail
            tags:
                - Stocks
            security:
                - OAuth2: [api:read]
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Stock asset UUID
                  schema:
                      type: string
                      format: uuid
            responses:
                '200':
                    description: Stock asset detail
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StockAssetDetail'
                '404':
                    description: Stock asset not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /home/device/record:
        post:
            summary: Create a new home device record
            tags:
                - Home Devices
            security:
                - OAuth2: [home:write]
                - ApiKey: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/HomeDeviceRecordCreate'
            responses:
                '200':
                    description: Created home device record
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HomeDeviceRecord'
    /home/device/records:
        get:
            summary: Get all devices with their latest measurements
            tags:
                - Home Devices
            security:
                - OAuth2: [home:read]
                - ApiKey: []
            parameters:
                - name: limit
                  in: query
                  required: false
                  description: Number of records to return per device (default 10)
                  schema:
                      type: integer
                      default: 10
            responses:
                '200':
                    description: List of devices with their measurements
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/HomeDeviceWithRecords'

    /me:
        get:
            summary: Get the user represented by an OAuth access token
            security:
                - OAuth2: [api:read]
            responses:
                '200':
                    description: Authenticated user
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [id, name, username]
                                properties:
                                    id:
                                        type: string
                                    name:
                                        type: string
                                    username:
                                        type: string
                '401':
                    description: Missing or invalid access token
                '403':
                    description: Missing scope or client-only token
    /api/oauth/token:
        servers:
            - url: /
        post:
            summary: Issue or refresh OAuth tokens
            description: Supports client_credentials, authorization_code with S256 PKCE, and refresh_token. Authenticate with HTTP Basic or form client_id/client_secret, never both. Native clients provide client_id without a secret.
            security: []
            requestBody:
                required: true
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            required: [grant_type]
                            properties:
                                grant_type:
                                    type: string
                                    enum: [client_credentials, authorization_code, refresh_token]
                                client_id:
                                    type: string
                                client_secret:
                                    type: string
                                scope:
                                    type: string
                                code:
                                    type: string
                                code_verifier:
                                    type: string
                                redirect_uri:
                                    type: string
                                refresh_token:
                                    type: string
            responses:
                '200':
                    description: Bearer tokens; refresh tokens are issued only for user authorization
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [token_type, expires_in, access_token]
                                properties:
                                    token_type:
                                        type: string
                                        enum: [Bearer]
                                    expires_in:
                                        type: integer
                                    access_token:
                                        type: string
                                    refresh_token:
                                        type: string
                '400':
                    description: OAuth protocol error
                '401':
                    description: Invalid client credentials
                '429':
                    description: Rate limit exceeded
                '503':
                    description: OAuth signing keys are not configured
    /api/oauth/revoke:
        servers:
            - url: /
        post:
            summary: Revoke a token and its authorization family
            description: Authenticate with HTTP Basic or form client_id/client_secret, never both. Native clients provide client_id without a secret. Unknown tokens and tokens owned by another client return 200.
            security: []
            requestBody:
                required: true
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            required: [token]
                            properties:
                                token:
                                    type: string
                                token_type_hint:
                                    type: string
                                    enum: [access_token, refresh_token]
                                client_id:
                                    type: string
                                client_secret:
                                    type: string
            responses:
                '200':
                    description: Token revoked or already invalid
                '400':
                    description: Invalid request
                '401':
                    description: Invalid client credentials
                '429':
                    description: Rate limit exceeded
                '503':
                    description: OAuth signing keys are not configured
    /api/oauth/authorize:
        servers:
            - url: /
        get:
            summary: Display the sessionless login and consent form
            description: Requires response_type=code, client_id, registered redirect_uri, state, scope, code_challenge and code_challenge_method=S256. This browser endpoint does not support CORS.
            security: []
            parameters:
                - name: response_type
                  in: query
                  required: true
                  schema:
                      type: string
                      enum: [code]
                - name: client_id
                  in: query
                  required: true
                  schema:
                      type: string
                - name: redirect_uri
                  in: query
                  required: true
                  schema:
                      type: string
                - name: scope
                  in: query
                  required: true
                  description: Space-separated scopes allowed for this client
                  schema:
                      type: string
                - name: state
                  in: query
                  required: true
                  schema:
                      type: string
                      minLength: 1
                      maxLength: 2048
                - name: code_challenge
                  in: query
                  required: true
                  schema:
                      type: string
                      pattern: '^[A-Za-z0-9_-]{43}$'
                - name: code_challenge_method
                  in: query
                  required: true
                  schema:
                      type: string
                      enum: [S256]
            responses:
                '200':
                    description: HTML login and consent form with a short-lived CSRF cookie
                    content:
                        text/html:
                            schema:
                                type: string
                '400':
                    description: Invalid authorization request
                '401':
                    description: Invalid client or unregistered redirect URI
                '429':
                    description: Rate limit exceeded
                '503':
                    description: OAuth signing keys are not configured
        post:
            summary: Authenticate the user and approve or deny the authorization request
            description: Browser form only. Requires the one-time transaction, its CSRF cookie, credentials and consent. Does not accept a password grant and never returns access tokens here.
            security: []
            parameters:
                - name: oauth_authorization
                  in: cookie
                  required: true
                  description: Short-lived CSRF proof set by the authorization form
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            required: [transaction, decision]
                            properties:
                                transaction:
                                    type: string
                                decision:
                                    type: string
                                    enum: [approve, deny]
                                username:
                                    type: string
                                    description: Required for approval
                                password:
                                    type: string
                                    format: password
                                    description: Required for approval
            responses:
                '303':
                    description: GET redirect to the registered application with a code or denial; credentials are never forwarded
                    headers:
                        Location:
                            schema:
                                type: string
                '400':
                    description: Expired or invalid transaction
                '401':
                    description: Invalid credentials or mandatory password change
                '403':
                    description: Invalid CSRF proof
                '429':
                    description: Rate limit exceeded
                '503':
                    description: OAuth signing keys are not configured

components:
    securitySchemes:
        OAuth2:
            type: oauth2
            flows:
                clientCredentials:
                    tokenUrl: /api/oauth/token
                    scopes:
                        api:read: Read shared portfolio and stock data
                        home:read: Read shared home devices and records
                        home:write: Create home device records
                authorizationCode:
                    authorizationUrl: /api/oauth/authorize
                    tokenUrl: /api/oauth/token
                    refreshUrl: /api/oauth/token
                    scopes:
                        api:read: Read shared portfolio and stock data
                        home:read: Read shared home devices and records
                        home:write: Create home device records
        ApiKey:
            type: apiKey
            in: header
            name: X-Api-Key
    schemas:
        StockAsset:
            type: object
            additionalProperties: false
            required:
                - id
                - name
                - ticker
                - exchange
                - currency
                - price
                - trend
                - oneDayChange
                - sevenDayChange
                - thirtyDayChange
                - priceFromAllModels
                - analyticsPrice
                - aiAnalysisPrice
                - priceDownloadedAt
                - assetPriceDownloader
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
                ticker:
                    type: string
                isin:
                    type: string
                    nullable: true
                exchange:
                    type: string
                currency:
                    type: string
                price:
                    type: number
                    format: float
                trend:
                    type: string
                    enum:
                        - increasing
                        - decreasing
                oneDayChange:
                    type: number
                    format: float
                sevenDayChange:
                    type: number
                    format: float
                thirtyDayChange:
                    type: number
                    format: float
                priceFromAllModels:
                    $ref: '#/components/schemas/StockAssetValuationPrice'
                analyticsPrice:
                    $ref: '#/components/schemas/StockAssetValuationPrice'
                aiAnalysisPrice:
                    $ref: '#/components/schemas/StockAssetValuationPrice'
                priceDownloadedAt:
                    type: string
                    nullable: true
                    format: date-time
                assetPriceDownloader:
                    type: string
        StockAssetValuationPrice:
            type: object
            additionalProperties: false
            nullable: true
            required:
                - price
                - currency
            properties:
                price:
                    type: number
                    format: float
                currency:
                    type: string
        StockAssetDetail:
            type: object
            additionalProperties: false
            required:
                - id
                - name
                - ticker
                - exchange
                - currency
                - price
                - trend
                - oneDayChange
                - sevenDayChange
                - thirtyDayChange
                - priceFromAllModels
                - analyticsPrice
                - aiAnalysisPrice
                - priceDownloadedAt
                - assetPriceDownloader
                - openPositions
                - dividends
                - valuationModels
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
                ticker:
                    type: string
                isin:
                    type: string
                    nullable: true
                exchange:
                    type: string
                currency:
                    type: string
                price:
                    type: number
                    format: float
                trend:
                    type: string
                    enum:
                        - increasing
                        - decreasing
                oneDayChange:
                    type: number
                    format: float
                sevenDayChange:
                    type: number
                    format: float
                thirtyDayChange:
                    type: number
                    format: float
                priceFromAllModels:
                    $ref: '#/components/schemas/StockAssetValuationPrice'
                analyticsPrice:
                    $ref: '#/components/schemas/StockAssetValuationPrice'
                aiAnalysisPrice:
                    $ref: '#/components/schemas/StockAssetValuationPrice'
                priceDownloadedAt:
                    type: string
                    nullable: true
                    format: date-time
                assetPriceDownloader:
                    type: string
                openPositions:
                    type: array
                    items:
                        $ref: '#/components/schemas/StockAssetOpenPosition'
                dividends:
                    type: array
                    items:
                        $ref: '#/components/schemas/StockAssetDividendDetail'
                valuationModels:
                    type: array
                    items:
                        $ref: '#/components/schemas/StockAssetValuationModel'
        StockAssetOpenPosition:
            type: object
            additionalProperties: false
            required:
                - id
                - orderPiecesCount
                - pricePerPiece
                - totalInvestedAmount
                - currentTotalAmount
                - totalInvestedAmountInBrokerCurrency
                - orderDate
                - differentBrokerAmount
            properties:
                id:
                    type: string
                    format: uuid
                orderPiecesCount:
                    type: integer
                pricePerPiece:
                    $ref: '#/components/schemas/StockAssetValuationPrice'
                totalInvestedAmount:
                    $ref: '#/components/schemas/StockAssetValuationPrice'
                currentTotalAmount:
                    $ref: '#/components/schemas/StockAssetValuationPrice'
                totalInvestedAmountInBrokerCurrency:
                    $ref: '#/components/schemas/StockAssetValuationPrice'
                orderDate:
                    type: string
                    format: date-time
                differentBrokerAmount:
                    type: boolean
        StockAssetDividendDetail:
            type: object
            additionalProperties: false
            required:
                - id
                - exDate
                - paymentDate
                - declarationDate
                - amount
                - currency
                - dividendType
                - paidAmount
                - records
            properties:
                id:
                    type: string
                    format: uuid
                exDate:
                    type: string
                    format: date-time
                paymentDate:
                    type: string
                    format: date-time
                    nullable: true
                declarationDate:
                    type: string
                    format: date-time
                    nullable: true
                amount:
                    type: number
                    format: float
                currency:
                    type: string
                dividendType:
                    type: string
                paidAmount:
                    $ref: '#/components/schemas/StockAssetPaidAmount'
                records:
                    type: array
                    items:
                        $ref: '#/components/schemas/StockAssetDividendRecord'
        StockAssetPaidAmount:
            type: object
            additionalProperties: false
            nullable: true
            required:
                - amount
                - currency
            properties:
                amount:
                    type: number
                    format: float
                currency:
                    type: string
        StockAssetDividendRecord:
            type: object
            additionalProperties: false
            required:
                - id
                - totalPiecesHeldAtExDate
                - totalAmount
                - currency
                - totalAmountInBrokerCurrency
                - brokerCurrency
                - reinvested
            properties:
                id:
                    type: string
                    format: uuid
                totalPiecesHeldAtExDate:
                    type: integer
                totalAmount:
                    type: number
                    format: float
                currency:
                    type: string
                totalAmountInBrokerCurrency:
                    type: number
                    format: float
                    nullable: true
                brokerCurrency:
                    type: string
                    nullable: true
                reinvested:
                    type: boolean
        StockAssetValuationModel:
            type: object
            additionalProperties: false
            required:
                - className
                - label
                - assetPrice
                - calculatedPercentage
                - calculatedValue
                - state
                - color
                - isCalculated
                - description
            properties:
                className:
                    type: string
                label:
                    type: string
                assetPrice:
                    $ref: '#/components/schemas/StockAssetValuationPrice'
                calculatedPercentage:
                    type: number
                    format: float
                    nullable: true
                calculatedValue:
                    type: number
                    format: float
                    nullable: true
                state:
                    type: string
                color:
                    type: string
                isCalculated:
                    type: boolean
                description:
                    type: string
                    nullable: true
        ErrorResponse:
            type: object
            additionalProperties: false
            required:
                - error
            properties:
                error:
                    type: string
        DashboardValue:
            type: object
            additionalProperties: false
            required:
                - label
                - value
                - color
            properties:
                label:
                    type: string
                value:
                    type: string
                color:
                    type: string
                svgIcon:
                    type: string
                    nullable: true
                description:
                    type: string
                    nullable: true
                type:
                    type: string
                    nullable: true
        DashboardValueTable:
            type: object
            additionalProperties: false
            required:
                - label
                - value
                - color
                - heading
                - data
            properties:
                label:
                    type: string
                value:
                    type: string
                color:
                    type: string
                heading:
                    type: object
                    additionalProperties:
                        type: string
                data:
                    type: array
                    items:
                        type: object
                        additionalProperties: true
        DashboardValueGroup:
            type: object
            additionalProperties: false
            required:
                - name
                - heading
                - positions
                - isOpen
                - tables
            properties:
                name:
                    type: string
                heading:
                    type: string
                description:
                    type: string
                    nullable: true
                positions:
                    type: array
                    items:
                        $ref: '#/components/schemas/DashboardValue'
                isOpen:
                    type: boolean
                tables:
                    type: array
                    items:
                        $ref: '#/components/schemas/DashboardValueTable'
        HomeDeviceRecordCreate:
            type: object
            additionalProperties: false
            required:
                - internalId
            properties:
                internalId:
                    type: string
                value:
                    oneOf:
                        - type: number
                          format: float
                        - type: boolean
                        - type: string
                    nullable: true
                unit:
                    type: string
                    nullable: true
                    enum:
                        - celsius
        HomeDeviceRecord:
            type: object
            additionalProperties: false
            required:
                - id
                - deviceInternalId
                - createdAt
            properties:
                id:
                    type: string
                    format: uuid
                deviceInternalId:
                    type: string
                value:
                    oneOf:
                        - type: number
                          format: float
                        - type: boolean
                        - type: string
                    nullable: true
                unit:
                    type: string
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
        HomeDeviceRecordSimple:
            type: object
            additionalProperties: false
            required:
                - id
                - createdAt
            properties:
                id:
                    type: string
                    format: uuid
                value:
                    oneOf:
                        - type: number
                          format: float
                        - type: boolean
                        - type: string
                    nullable: true
                unit:
                    type: string
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
        HomeDeviceWithRecords:
            type: object
            additionalProperties: false
            required:
                - id
                - internalId
                - name
                - type
                - records
            properties:
                id:
                    type: string
                    format: uuid
                internalId:
                    type: string
                name:
                    type: string
                type:
                    type: string
                latestRecord:
                    oneOf:
                        - $ref: '#/components/schemas/HomeDeviceRecordSimple'
                        - type: 'null'
                records:
                    type: array
                    items:
                        $ref: '#/components/schemas/HomeDeviceRecordSimple'


servers:
    - url: /api/v1
    - url: http://localhost/my-portfolio-tracker/www/api/v1
