openapi: 3.0.0

info:
    title: My Portfolio Tracker API
    version: 1.0.0

tags:
    - name: System
      description: System and health-check endpoints.
    - name: Dashboard
      description: Dashboard summary endpoints.
    - name: Stocks
      description: Stock asset endpoints.
    - name: Home Devices
      description: Home device measurement endpoints.
    - name: Market
      description: Shared exchange rates and company dividend events.
    - name: Portfolio
      description: The authenticated user's portfolio data.

security:
    - OAuth2: [api:read]

paths:
    /dashboard/summary:
        get:
            summary: Get the authenticated user's numeric dashboard summary
            description: >-
                Requires user authorization and portfolio:read. Amounts are unformatted numbers
                in CZK; percentages use percentage points (12.5 means 12.5%). Open-position
                totals use the same historical broker-cost and current-value calculations as
                the web dashboard. Annual dividends include all recorded entitlements, including
                announced future events, grouped by ex-date year. No forecast or insufficient
                performance history is represented by null. Empty portfolios have zero totals.
                generatedAt is the response assembly time, not the freshness of every price.
            tags: [Dashboard]
            security:
                - OAuth2: [portfolio:read]
            responses:
                '200':
                    description: Personal portfolio summary
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DashboardSummary'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '503':
                    $ref: '#/components/responses/DataUnavailable'
    /exchange-rates:
        get:
            summary: Get the twelve exchange-rate pairs used by the dashboard
            description: >-
                Shared data, available to user and client-only tokens. Returns the latest stored
                rate for each pair, with its own effective date and update timestamp. A rate is
                the amount of toCurrency for one unit of fromCurrency. Missing required rates
                return 503; rates are never silently replaced by zero.
            tags: [Market]
            security:
                - OAuth2: [market:read]
            responses:
                '200':
                    description: Latest stored exchange rates
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                required: [items]
                                properties:
                                    items:
                                        type: array
                                        minItems: 12
                                        maxItems: 12
                                        items:
                                            $ref: '#/components/schemas/ExchangeRate'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '503':
                    $ref: '#/components/responses/DataUnavailable'
    /portfolio/dividends:
        get:
            summary: Get the authenticated user's latest dividend records
            description: >-
                Includes announced future entitlements as on the web dashboard. Ordered by
                exDate descending, then record ID ascending. Gross and net amounts are totals
                for the user's pieces, in the record currency. Both regular and special dividends
                are included. Shared dividend events contain no other users' records.
            tags: [Portfolio]
            security:
                - OAuth2: [portfolio:read]
            parameters:
                - $ref: '#/components/parameters/DividendLimit'
            responses:
                '200':
                    description: Personal dividend records
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                required: [items]
                                properties:
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/PortfolioDividend'
                '400':
                    $ref: '#/components/responses/InvalidRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
    /stock-dividends:
        get:
            summary: Get shared company dividend events
            description: >-
                Available to user and client-only tokens. Amounts are per share, in the event
                currency. Includes both regular and special dividends. Date bounds are inclusive;
                exDateFrom must not exceed exDateTo. Sorts by exDate and then event ID ascending.
                For the web dashboard's last-year window use exDateFrom = today minus 380 days,
                sort = exDateAsc, and limit = 8. Contains no personal holdings or paid amounts.
            tags: [Market]
            security:
                - OAuth2: [market:read]
            parameters:
                - $ref: '#/components/parameters/DividendLimit'
                - name: exDateFrom
                  in: query
                  schema: {type: string, format: date}
                - name: exDateTo
                  in: query
                  schema: {type: string, format: date}
                - name: sort
                  in: query
                  schema: {type: string, enum: [exDateDesc, exDateAsc], default: exDateDesc}
            responses:
                '200':
                    description: Shared dividend events
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: false
                                required: [items]
                                properties:
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/CompanyDividend'
                '400':
                    $ref: '#/components/responses/InvalidRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
    /ping:
        get:
            summary: Ping the API
            tags:
                - System
            security:
                - OAuth2: [api:read]
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
    /dashboard/values:
        get:
            summary: Get dashboard value groups
            description: >-
                Requires a user access token. Personal values, dividends and performance
                belong only to the token's user. Market prices and currency rates are shared.
            tags:
                - Dashboard
            security:
                - OAuth2: [api:read]
            responses:
                '200':
                    description: List of dashboard value groups
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/DashboardValueGroup'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
    /stocks:
        get:
            summary: Get list of all stock assets
            description: >-
                Shared stock catalog. AI analysis prices belong only to the token's user
                and are null for client-only tokens or users without their own analysis.
            tags:
                - Stocks
            security:
                - OAuth2: [api:read]
            responses:
                '200':
                    description: List of stock assets
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/StockAsset'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
    /stocks/{id}:
        get:
            summary: Get single stock asset detail
            description: >-
                Requires a user access token. The stock and dividend events are shared;
                open positions, dividend records, paid amounts and AI analysis prices
                belong only to the token's user. A user may view a stock they do not own.
            tags:
                - Stocks
            security:
                - OAuth2: [api:read]
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Stock asset UUID
                  schema:
                      type: string
                      format: uuid
            responses:
                '200':
                    description: Stock asset detail
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StockAssetDetail'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Stock asset not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /home/device/record:
        post:
            summary: Create a new home device record
            description: >-
                Requires a user access token or a legacy API key bound to a user.
                The device must belong to that user's home. Unknown and other users'
                internal IDs both return 404. Client-only OAuth tokens are rejected.
            tags:
                - Home Devices
            security:
                - OAuth2: [home:write]
                - ApiKey: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/HomeDeviceRecordCreate'
            responses:
                '200':
                    description: Created home device record
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HomeDeviceRecord'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    description: Home device not found for the authenticated user
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
    /home/device/records:
        get:
            summary: Get all devices with their latest measurements
            description: >-
                Returns only devices and records belonging to the authenticated user's homes.
                Requires a user access token or a legacy API key bound to that user.
                Client-only OAuth tokens are rejected.
            tags:
                - Home Devices
            security:
                - OAuth2: [home:read]
                - ApiKey: []
            parameters:
                - name: limit
                  in: query
                  required: false
                  description: Number of records to return per device (default 10)
                  schema:
                      type: integer
                      default: 10
            responses:
                '200':
                    description: List of devices with their measurements
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/HomeDeviceWithRecords'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'

    /me:
        get:
            summary: Get the user represented by an OAuth access token
            security:
                - OAuth2: [api:read]
                - OAuth2: [portfolio:read]
            responses:
                '200':
                    description: Authenticated user
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [id, name, username]
                                properties:
                                    id:
                                        type: string
                                    name:
                                        type: string
                                    username:
                                        type: string
                '401':
                    description: Missing or invalid access token
                '403':
                    description: Missing scope or client-only token
    /api/oauth/token:
        servers:
            - url: /
        post:
            summary: Issue or refresh OAuth tokens
            description: Supports client_credentials, authorization_code with S256 PKCE, and refresh_token. Authenticate with HTTP Basic or form client_id/client_secret, never both. Native clients provide client_id without a secret.
            security: []
            requestBody:
                required: true
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            required: [grant_type]
                            properties:
                                grant_type:
                                    type: string
                                    enum: [client_credentials, authorization_code, refresh_token]
                                client_id:
                                    type: string
                                client_secret:
                                    type: string
                                scope:
                                    type: string
                                code:
                                    type: string
                                code_verifier:
                                    type: string
                                redirect_uri:
                                    type: string
                                refresh_token:
                                    type: string
            responses:
                '200':
                    description: Bearer tokens; refresh tokens are issued only for user authorization
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [token_type, expires_in, access_token]
                                properties:
                                    token_type:
                                        type: string
                                        enum: [Bearer]
                                    expires_in:
                                        type: integer
                                    access_token:
                                        type: string
                                    refresh_token:
                                        type: string
                '400':
                    description: OAuth protocol error
                '401':
                    description: Invalid client credentials
                '429':
                    description: Rate limit exceeded
                '503':
                    description: OAuth signing keys are not configured
    /api/oauth/revoke:
        servers:
            - url: /
        post:
            summary: Revoke a token and its authorization family
            description: Authenticate with HTTP Basic or form client_id/client_secret, never both. Native clients provide client_id without a secret. Unknown tokens and tokens owned by another client return 200.
            security: []
            requestBody:
                required: true
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            required: [token]
                            properties:
                                token:
                                    type: string
                                token_type_hint:
                                    type: string
                                    enum: [access_token, refresh_token]
                                client_id:
                                    type: string
                                client_secret:
                                    type: string
            responses:
                '200':
                    description: Token revoked or already invalid
                '400':
                    description: Invalid request
                '401':
                    description: Invalid client credentials
                '429':
                    description: Rate limit exceeded
                '503':
                    description: OAuth signing keys are not configured
    /api/oauth/authorize:
        servers:
            - url: /
        get:
            summary: Display the sessionless login and consent form
            description: Requires response_type=code, client_id, registered redirect_uri, state, scope, code_challenge and code_challenge_method=S256. This browser endpoint does not support CORS.
            security: []
            parameters:
                - name: response_type
                  in: query
                  required: true
                  schema:
                      type: string
                      enum: [code]
                - name: client_id
                  in: query
                  required: true
                  schema:
                      type: string
                - name: redirect_uri
                  in: query
                  required: true
                  schema:
                      type: string
                - name: scope
                  in: query
                  required: true
                  description: Space-separated scopes allowed for this client
                  schema:
                      type: string
                - name: state
                  in: query
                  required: true
                  schema:
                      type: string
                      minLength: 1
                      maxLength: 2048
                - name: code_challenge
                  in: query
                  required: true
                  schema:
                      type: string
                      pattern: '^[A-Za-z0-9_-]{43}$'
                - name: code_challenge_method
                  in: query
                  required: true
                  schema:
                      type: string
                      enum: [S256]
            responses:
                '200':
                    description: HTML login and consent form with a short-lived CSRF cookie
                    content:
                        text/html:
                            schema:
                                type: string
                '400':
                    description: Invalid authorization request
                '401':
                    description: Invalid client or unregistered redirect URI
                '429':
                    description: Rate limit exceeded
                '503':
                    description: OAuth signing keys are not configured
        post:
            summary: Authenticate the user and approve or deny the authorization request
            description: Browser form only. Requires the one-time transaction, its CSRF cookie, credentials and consent. Does not accept a password grant and never returns access tokens here.
            security: []
            parameters:
                - name: oauth_authorization
                  in: cookie
                  required: true
                  description: Short-lived CSRF proof set by the authorization form
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            required: [transaction, decision]
                            properties:
                                transaction:
                                    type: string
                                decision:
                                    type: string
                                    enum: [approve, deny]
                                username:
                                    type: string
                                    description: Required for approval
                                password:
                                    type: string
                                    format: password
                                    description: Required for approval
            responses:
                '303':
                    description: GET redirect to the registered application with a code or denial; credentials are never forwarded
                    headers:
                        Location:
                            schema:
                                type: string
                '400':
                    description: Expired or invalid transaction
                '401':
                    description: Invalid credentials or mandatory password change
                '403':
                    description: Invalid CSRF proof
                '429':
                    description: Rate limit exceeded
                '503':
                    description: OAuth signing keys are not configured

components:
    parameters:
        DividendLimit:
            name: limit
            in: query
            description: Maximum number of items to return.
            schema: {type: integer, minimum: 1, maximum: 50, default: 8}
    responses:
        InvalidRequest:
            description: Invalid query parameters
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/OAuthErrorResponse'
        DataUnavailable:
            description: Required exchange rate data or OAuth configuration is unavailable
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/OAuthErrorResponse'
        Unauthorized:
            description: Missing or invalid authentication
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/OAuthErrorResponse'
        Forbidden:
            description: Missing scope or user authorization required
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/OAuthErrorResponse'
    securitySchemes:
        OAuth2:
            type: oauth2
            flows:
                clientCredentials:
                    tokenUrl: /api/oauth/token
                    scopes:
                        api:read: Read shared stock catalog; personal endpoints require user authorization
                        market:read: Read shared exchange rates and company dividend events
                        portfolio:read: Read personal dashboard and dividends; requires user authorization
                        home:read: Read own home devices and records; requires user authorization
                        home:write: Create records for own home devices; requires user authorization
                authorizationCode:
                    authorizationUrl: /api/oauth/authorize
                    tokenUrl: /api/oauth/token
                    refreshUrl: /api/oauth/token
                    scopes:
                        api:read: Read own portfolio and shared stock data
                        portfolio:read: Read own dashboard, dividend records and user identity
                        market:read: Read shared exchange rates and company dividend events
                        home:read: Read own home devices and records
                        home:write: Create records for own home devices
        ApiKey:
            type: apiKey
            in: header
            name: X-Api-Key
    schemas:
        DashboardSummary:
            type: object
            additionalProperties: false
            required: [generatedAt, currency, total, stocks, crypto, portu, dividends, performance, stockMovers]
            properties:
                generatedAt: {type: string, format: date-time}
                currency: {type: string, enum: [CZK]}
                total:
                    $ref: '#/components/schemas/PortfolioAmounts'
                stocks:
                    type: object
                    additionalProperties: false
                    required: [amounts, closedPositionsProfitIncludingDividends, byTradingCurrency]
                    properties:
                        amounts:
                            $ref: '#/components/schemas/PortfolioAmounts'
                        closedPositionsProfitIncludingDividends:
                            type: number
                            description: Realized stock profit including dividends, using historical CZK conversion.
                        byTradingCurrency:
                            type: array
                            description: Current value in CZK grouped by the stock's trading currency, not country.
                            items:
                                type: object
                                additionalProperties: false
                                required: [currency, currentValue]
                                properties:
                                    currency:
                                        $ref: '#/components/schemas/ApiCurrency'
                                    currentValue: {type: number}
                crypto:
                    $ref: '#/components/schemas/PortfolioAmounts'
                portu:
                    $ref: '#/components/schemas/PortfolioAmounts'
                dividends:
                    type: object
                    additionalProperties: false
                    required: [byYear, remainingForecast]
                    properties:
                        byYear:
                            type: array
                            description: Ex-date years descending; net uses the configured stock dividend tax.
                            items:
                                $ref: '#/components/schemas/DividendYearAmounts'
                        remainingForecast:
                            type: object
                            nullable: true
                            additionalProperties: false
                            description: Remaining net and gross amounts of the current year's default forecast, at current exchange rates.
                            required: [year, grossAmount, netAmount]
                            properties:
                                year: {type: integer}
                                grossAmount: {type: number}
                                netAmount: {type: number}
                performance:
                    type: object
                    nullable: true
                    additionalProperties: false
                    description: Stored historical portfolio performance, as on the web dashboard; GET never rebuilds statistics.
                    required: [from, to, timeWeightedReturnPercent, annualizedTimeWeightedReturnPercent, moneyWeightedReturnPercent, xirrPercent]
                    properties:
                        from: {type: string, format: date, nullable: true}
                        to: {type: string, format: date, nullable: true}
                        timeWeightedReturnPercent: {type: number}
                        annualizedTimeWeightedReturnPercent: {type: number, nullable: true}
                        moneyWeightedReturnPercent: {type: number, nullable: true}
                        xirrPercent: {type: number, nullable: true}
                stockMovers:
                    type: object
                    additionalProperties: false
                    description: Best and worst four owned open stocks versus the previous trading day. Lists can overlap; missing price history follows the web's zero-change behavior.
                    required: [best, worst]
                    properties:
                        best:
                            type: array
                            maxItems: 4
                            items:
                                $ref: '#/components/schemas/StockMover'
                        worst:
                            type: array
                            maxItems: 4
                            items:
                                $ref: '#/components/schemas/StockMover'
        PortfolioAmounts:
            type: object
            additionalProperties: false
            required: [investedAmount, currentValue, profit, profitPercent]
            properties:
                investedAmount: {type: number}
                currentValue: {type: number}
                profit: {type: number}
                profitPercent:
                    type: number
                    description: Relative to invested amount; follows web semantics (0 for an empty portfolio, 100 when cost is zero but value is nonzero).
        DividendYearAmounts:
            type: object
            additionalProperties: false
            required: [year, grossAmount, netAmount]
            properties:
                year: {type: integer}
                grossAmount: {type: number}
                netAmount: {type: number}
        StockMover:
            type: object
            additionalProperties: false
            required: [stock, changePercent]
            properties:
                stock:
                    $ref: '#/components/schemas/StockReference'
                changePercent: {type: number}
        StockReference:
            type: object
            additionalProperties: false
            required: [id, name, ticker]
            properties:
                id: {type: string, format: uuid}
                name: {type: string}
                ticker: {type: string}
        ApiCurrency:
            type: string
            enum: [USD, EUR, CZK, GBP, PLN, NOK]
        ExchangeRate:
            type: object
            additionalProperties: false
            required: [fromCurrency, toCurrency, rate, forDate, updatedAt, source]
            properties:
                fromCurrency:
                    $ref: '#/components/schemas/ApiCurrency'
                toCurrency:
                    $ref: '#/components/schemas/ApiCurrency'
                rate: {type: number}
                forDate: {type: string, format: date}
                updatedAt: {type: string, format: date-time}
                source: {type: string, enum: [CNB, ECB]}
        CompanyDividend:
            type: object
            additionalProperties: false
            required: [id, stock, type, exDate, paymentDate, declarationDate, currency, grossAmountPerShare, netAmountPerShare, taxPercent]
            properties:
                id: {type: string, format: uuid}
                stock:
                    $ref: '#/components/schemas/StockReference'
                type: {type: string, enum: [regular, special]}
                exDate: {type: string, format: date}
                paymentDate: {type: string, format: date, nullable: true}
                declarationDate: {type: string, format: date, nullable: true}
                currency:
                    $ref: '#/components/schemas/ApiCurrency'
                grossAmountPerShare: {type: number}
                netAmountPerShare:
                    type: number
                    description: Per-share amount after the shared stock's configured dividend tax.
                taxPercent: {type: number, nullable: true}
        PortfolioDividend:
            type: object
            additionalProperties: false
            required: [id, dividend, piecesHeldAtExDate, currency, grossAmount, netAmount, reinvested, updatedAt]
            properties:
                id: {type: string, format: uuid}
                dividend:
                    $ref: '#/components/schemas/CompanyDividend'
                piecesHeldAtExDate: {type: integer}
                currency:
                    $ref: '#/components/schemas/ApiCurrency'
                grossAmount: {type: number}
                netAmount: {type: number}
                reinvested: {type: boolean}
                updatedAt: {type: string, format: date-time}
        OAuthErrorResponse:
            type: object
            required: [error, error_description]
            properties:
                error:
                    type: string
                error_description:
                    type: string
        StockAsset:
            type: object
            additionalProperties: false
            required:
                - id
                - name
                - ticker
                - exchange
                - currency
                - price
                - trend
                - oneDayChange
                - sevenDayChange
                - thirtyDayChange
                - priceFromAllModels
                - analyticsPrice
                - aiAnalysisPrice
                - priceDownloadedAt
                - assetPriceDownloader
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
                ticker:
                    type: string
                isin:
                    type: string
                    nullable: true
                exchange:
                    type: string
                currency:
                    type: string
                price:
                    type: number
                    format: float
                trend:
                    type: string
                    enum:
                        - increasing
                        - decreasing
                oneDayChange:
                    type: number
                    format: float
                sevenDayChange:
                    type: number
                    format: float
                thirtyDayChange:
                    type: number
                    format: float
                priceFromAllModels:
                    $ref: '#/components/schemas/StockAssetValuationPrice'
                analyticsPrice:
                    $ref: '#/components/schemas/StockAssetValuationPrice'
                aiAnalysisPrice:
                    $ref: '#/components/schemas/StockAssetValuationPrice'
                priceDownloadedAt:
                    type: string
                    nullable: true
                    format: date-time
                assetPriceDownloader:
                    type: string
        StockAssetValuationPrice:
            type: object
            additionalProperties: false
            nullable: true
            required:
                - price
                - currency
            properties:
                price:
                    type: number
                    format: float
                currency:
                    type: string
        StockAssetDetail:
            type: object
            additionalProperties: false
            required:
                - id
                - name
                - ticker
                - exchange
                - currency
                - price
                - trend
                - oneDayChange
                - sevenDayChange
                - thirtyDayChange
                - priceFromAllModels
                - analyticsPrice
                - aiAnalysisPrice
                - priceDownloadedAt
                - assetPriceDownloader
                - openPositions
                - dividends
                - valuationModels
            properties:
